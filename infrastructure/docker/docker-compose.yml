version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: always
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian_user
      POSTGRES_PASSWORD: meridian_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: meridian-api
    restart: always
    environment:
      DATABASE_URL: postgresql://meridian_user:meridian_secure_password_2026@db:5432/meridian
      REDIS_URL: redis://redis:6379/0
      MERIDIAN_SECRET_KEY: meridian-institutional-secret-key-production-ready
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: meridian-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
